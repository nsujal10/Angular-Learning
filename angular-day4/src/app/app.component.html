<div class="portal-root">
  <!-- Global HTTP In-Flight Progress Bar -->
  <div class="global-progress-bar" *ngIf="loadingService.isLoading$ | async">
    <div class="progress-bar-inner"></div>
  </div>

  <!-- Navbar -->
  <header class="portal-nav">
    <div class="nav-left">
      <a routerLink="/dashboard" class="brand-link">
        <div class="brand-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        </div>
        <div class="brand-titles">
          <span class="brand-name">SpikeHR <span class="version-tag">v4</span></span>
          <span class="brand-sub">REST Backend &bull; Dark Dashboard</span>
        </div>
      </a>

      <!-- Primary Links -->
      <nav class="nav-links" *ngIf="authService.isAuthenticated()">
        <a
          routerLink="/dashboard"
          routerLinkActive="active-nav"
          class="nav-item"
        >
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a
          routerLink="/employees"
          routerLinkActive="active-nav"
          class="nav-item"
        >
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Employees
        </a>
        <a
          routerLink="/admin-settings"
          routerLinkActive="active-nav"
          class="nav-item"
          [class.locked]="!authService.isAdmin()"
          title="{{ !authService.isAdmin() ? 'Restricted: Admin role only' : 'Admin Settings' }}"
        >
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Admin Settings
          <span class="lock-indicator" *ngIf="!authService.isAdmin()">🔒</span>
        </a>
      </nav>
    </div>

    <!-- Right Controls -->
    <div class="nav-right" *ngIf="authService.isAuthenticated()">
      <!-- Active Simulation Warning Indicator -->
      <span class="sim-alert-pill" *ngIf="simulationService.isOffline$ | async">
        ⚠️ OFFLINE SIMULATION ACTIVE
      </span>

      <!-- User Profile Dropdown / Sign Out -->
      <div class="user-strip">
        <div class="avatar-tag">
          {{ authService.currentUser?.avatar || 'US' }}
        </div>
        <div class="user-meta">
          <span class="user-name">{{ authService.currentUser?.name }}</span>
          <span
            class="user-role"
            [class.admin]="authService.isAdmin()"
            [class.manager]="authService.isManager()"
          >
            {{ authService.currentUser?.role }} Role
          </span>
        </div>
        <button
          type="button"
          class="btn-logout"
          (click)="authService.logout()"
          title="Sign Out (POST /api/auth/logout)"
        >
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>

    <!-- Login CTA if not signed in -->
    <div class="nav-right" *ngIf="!authService.isAuthenticated()">
      <a routerLink="/login" class="btn btn-primary btn-sm">Sign In</a>
    </div>
  </header>

  <!-- Main View Router Outlet -->
  <main class="portal-main">
    <router-outlet></router-outlet>
  </main>

  <!-- Toast Stack -->
  <aside class="toast-stack" aria-live="polite" *ngIf="toasts.length > 0">
    <div
      class="toast-item"
      *ngFor="let toast of toasts"
      [class.toast-success]="toast.type === 'success'"
      [class.toast-error]="toast.type === 'error'"
      [class.toast-warning]="toast.type === 'warning'"
      [class.toast-info]="toast.type === 'info'"
    >
      <div class="toast-icon">
        <span *ngIf="toast.type === 'success'">✓</span>
        <span *ngIf="toast.type === 'error'">✕</span>
        <span *ngIf="toast.type === 'warning'">⚠️</span>
        <span *ngIf="toast.type === 'info'">ℹ️</span>
      </div>
      <div class="toast-body">
        <h4 class="toast-title">{{ toast.title }}</h4>
        <p class="toast-desc">{{ toast.message }}</p>
      </div>
      <button type="button" class="toast-close" (click)="dismissToast(toast.id)">✕</button>
    </div>
  </aside>
</div>
