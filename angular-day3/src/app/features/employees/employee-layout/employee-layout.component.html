<div class="employee-shell">
  <!-- Layout Sub-Navigation Bar -->
  <div class="layout-nav">
    <div class="layout-tabs">
      <a
        routerLink="/employees"
        routerLinkActive="active-tab"
        [routerLinkActiveOptions]="{ exact: true }"
        class="tab-link"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Directory List
      </a>
      <a
        routerLink="/employees/new"
        routerLinkActive="active-tab"
        class="tab-link"
        *ngIf="authService.isAdmin() || authService.isManager()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Onboard New Member
      </a>
    </div>

    <div class="role-indicator">
      <span class="role-pill" [class.admin]="authService.isAdmin()">
        {{ authService.currentUser?.role }} Access Active
      </span>
    </div>
  </div>

  <!-- Nested Child Route Outlet -->
  <div class="layout-outlet-container">
    <router-outlet></router-outlet>
  </div>
</div>
