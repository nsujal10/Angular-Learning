<div class="login-wrapper">
  <div class="login-card portal-card">
    <div class="login-brand">
      <div class="brand-badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <h2>SpikeHR Portal</h2>
      <p class="brand-desc">Enterprise HR & Payroll Management</p>
    </div>

    <!-- Quick Role Selection Shortcuts for Testing -->
    <div class="quick-roles-container">
      <span class="quick-title">Quick Demo Logins (Click to Test):</span>
      <div class="quick-buttons">
        <button type="button" class="role-pill pill-admin" (click)="quickLogin('Admin')">
          👑 Admin
        </button>
        <button type="button" class="role-pill pill-manager" (click)="quickLogin('Manager')">
          💼 Manager
        </button>
        <button type="button" class="role-pill pill-employee" (click)="quickLogin('Employee')">
          👤 Employee
        </button>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">
          Email Address <span class="req">*</span>
        </label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="f['email'].touched && f['email'].invalid"
          placeholder="admin@spikeoffice.io"
        />
        <div class="invalid-feedback" *ngIf="f['email'].touched && f['email'].errors?.['required']">
          Email is required.
        </div>
        <div class="invalid-feedback" *ngIf="f['email'].touched && f['email'].errors?.['email']">
          Enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">
          Password <span class="req">*</span>
        </label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="f['password'].touched && f['password'].invalid"
          placeholder="••••••••"
        />
        <div class="invalid-feedback" *ngIf="f['password'].touched && f['password'].errors?.['required']">
          Password is required.
        </div>
        <div class="invalid-feedback" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-role">
          Assigned Role <span class="req">*</span>
        </label>
        <select
          id="login-role"
          formControlName="role"
          class="form-control"
        >
          <option value="Admin">Admin (Full Access + Settings + Manage All)</option>
          <option value="Manager">Manager (Edit Employees + Manager Fields)</option>
          <option value="Employee">Employee (View Only, Guards Will Intercept Restricted Routes)</option>
        </select>
        <small class="form-hint">Used by <code>AdminGuard</code> & route protection tests.</small>
      </div>

      <button
        type="submit"
        class="btn btn-primary login-btn"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading">Sign In to Dashboard</span>
        <span *ngIf="isLoading">Authenticating...</span>
      </button>
    </form>
  </div>
</div>
